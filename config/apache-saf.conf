# SAF — Sistema de Autotransporte Federal
# Acceso: http://<servidor>/saf/  o  http://saf.local/
Alias /saf /var/www/html/saf/webroot

<Directory /var/www/html/saf/webroot>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<VirtualHost *:80>
    ServerName saf.local
    DocumentRoot /var/www/html/saf/webroot

    <Directory /var/www/html/saf/webroot>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/saf_error.log
    CustomLog ${APACHE_LOG_DIR}/saf_access.log combined
</VirtualHost>
